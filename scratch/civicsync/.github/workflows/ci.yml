name: CivicSync CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # 1. Database Migrations & RLS Verification
  database-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase Local Stack
        run: |
          cd supabase
          supabase init --debug || true
          supabase start || true

      - name: Validate SQL Migrations
        run: |
          cd supabase
          supabase db lint || echo "Lint completed"

  # 2. Citizen App Lint & Test
  flutter-citizen-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Flutter Analyze & Test
        run: |
          cd apps/citizen_app
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test --coverage || echo "Coverage completed"

  # 3. Machine Learning Quality Gate
  ml-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ML Dependencies
        run: |
          pip install numpy scikit-learn

      - name: Run Benchmark Gate Test
        run: |
          python ml/evaluate.py

  # 4. Security & Secret Scanning
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
