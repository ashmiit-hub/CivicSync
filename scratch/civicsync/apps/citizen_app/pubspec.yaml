name: citizen_app
description: CivicSync Citizen Hazard Reporting Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Core State & Architecture
  intl: ^0.20.2
  uuid: ^4.5.1
  path_provider: ^2.1.5
  path: ^1.9.1
  
  # Camera, Media & Privacy
  camera: ^0.11.1
  image: ^4.5.3
  flutter_image_compress: ^2.4.0
  google_mlkit_face_detection: ^0.13.1
  google_mlkit_text_recognition: ^0.15.0
  
  # Location & Maps
  geolocator: ^13.0.2
  google_maps_flutter: ^2.10.1
  
  # Offline Storage & Database (Drift)
  drift: ^2.25.0
  sqlite3_flutter_libs: ^0.5.28
  
  # Background Sync & Connectivity
  workmanager: ^0.5.2
  connectivity_plus: ^6.1.3
  http: ^1.3.0
  
  # Security & Tokens
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6

  # On-Device Machine Learning
  tflite_flutter: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.25.0
  build_runner: ^2.4.15
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
